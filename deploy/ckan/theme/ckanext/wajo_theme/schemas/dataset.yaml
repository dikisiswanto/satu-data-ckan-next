dataset_type: dataset
about: Portal Satu Data Kabupaten Wajo metadata schema
about_url: https://github.com/ckan/ckanext-scheming

dataset_fields:
  - field_name: title
    label: Judul dataset
    preset: title
    form_placeholder: "Contoh: Data Penduduk Kabupaten Wajo Menurut Kecamatan"

  - field_name: name
    label: URL dataset
    preset: dataset_slug
    form_placeholder: data-penduduk-menurut-kecamatan

  - field_name: notes
    label: Deskripsi
    form_snippet: markdown.html
    form_placeholder: Jelaskan isi, tujuan, cakupan, dan cara menggunakan data.

  - field_name: tag_string
    label: Kata kunci
    preset: tag_string_autocomplete
    form_placeholder: penduduk, kecamatan, 2025
    help_text: Untuk halaman portal, gunakan tag portal-indikator, portal-infografik, atau portal-publikasi sesuai jenis konten.

  - field_name: license_id
    label: Lisensi
    form_snippet: license.html
    help_text: Pilih lisensi yang menjelaskan hak penggunaan ulang data.

  - field_name: owner_org
    label: Organisasi pengampu
    preset: dataset_organization

  - field_name: url
    label: Sumber atau URL referensi
    form_placeholder: https://...
    display_property: foaf:homepage
    display_snippet: link.html

  - field_name: version
    label: Versi metadata/dataset
    validators: ignore_missing unicode_safe
    form_placeholder: 1.0 atau 2025.1
    help_text: Versi rilis dataset, bukan pengganti riwayat aktivitas CKAN.

  - field_name: author
    label: Produsen data
    form_placeholder: Nama perangkat daerah atau unit produsen
    display_property: dc:creator

  - field_name: author_email
    label: Email produsen data
    form_placeholder: data@wajokab.go.id
    display_property: dc:creator
    display_snippet: email.html
    display_email_name_field: author

  - field_name: maintainer
    label: Pengelola/pemutakhir data
    form_placeholder: Nama unit pengelola data
    display_property: dc:contributor

  - field_name: maintainer_email
    label: Email pengelola data
    form_placeholder: data@wajokab.go.id
    display_property: dc:contributor
    display_snippet: email.html
    display_email_name_field: maintainer

  - field_name: portal_type
    label: Tipe konten portal
    preset: select
    choices:
      - value: dataset
        label: Dataset
      - value: indikator
        label: Indikator statistik
      - value: infografik
        label: Infografik
      - value: publikasi
        label: Publikasi/laporan
      - value: geospasial
        label: Data geospasial
    help_text: Pilih tipe lalu tambahkan tag portal-indikator, portal-infografik, atau portal-publikasi agar mudah ditemukan di halaman publik.

  - field_name: portal_reference_period
    label: Periode acuan
    form_placeholder: 2025, 2024–2025, Triwulan I 2026
    help_text: Periode yang direpresentasikan isi data, bukan tanggal metadata diubah.

  - field_name: portal_data_start
    label: Awal cakupan periode
    preset: date
    form_placeholder: YYYY-MM-DD

  - field_name: portal_data_end
    label: Akhir cakupan periode
    preset: date
    form_placeholder: YYYY-MM-DD

  - field_name: portal_periodicity
    label: Frekuensi data
    preset: select
    choices:
      - value: harian
        label: Harian
      - value: mingguan
        label: Mingguan
      - value: bulanan
        label: Bulanan
      - value: triwulanan
        label: Triwulanan
      - value: semesteran
        label: Semesteran
      - value: tahunan
        label: Tahunan
      - value: tidak-berkala
        label: Tidak berkala
    validators: ignore_missing

  - field_name: portal_update_frequency
    label: Jadwal pemutakhiran
    preset: select
    choices:
      - value: real-time
        label: Real time
      - value: harian
        label: Harian
      - value: bulanan
        label: Bulanan
      - value: triwulanan
        label: Triwulanan
      - value: semesteran
        label: Semesteran
      - value: tahunan
        label: Tahunan
      - value: sesuai-ketersediaan
        label: Sesuai ketersediaan sumber
    validators: ignore_missing

  - field_name: portal_publication_date
    label: Tanggal rilis publikasi
    preset: date
    form_placeholder: YYYY-MM-DD

  - field_name: portal_version
    label: Versi rilis data
    form_placeholder: v1.0, 2025.1
    help_text: Gunakan versi yang naik saat data/rilis diperbarui secara substantif.

  - field_name: portal_revision_note
    label: Catatan perubahan rilis
    form_snippet: markdown.html
    form_placeholder: Jelaskan perubahan dari versi sebelumnya, koreksi, atau revisi angka.

  - field_name: portal_methodology
    label: Metodologi dan definisi
    form_snippet: markdown.html
    form_placeholder: Definisi, rumus, sumber perhitungan, batasan, dan catatan kualitas data.

  - field_name: portal_definition
    label: Definisi indikator
    form_snippet: markdown.html
    form_placeholder: Jelaskan makna indikator, konsep yang diukur, populasi/cakupan, dan batas interpretasinya.

  - field_name: portal_unit
    label: Satuan indikator
    form_placeholder: Persen, jiwa, kilometer, indeks, rupiah

  - field_name: portal_formula
    label: Rumus indikator
    form_snippet: markdown.html
    form_placeholder: Tuliskan rumus atau tautan metodologi resmi.

  - field_name: portal_source
    label: Sumber data
    form_placeholder: Perangkat daerah, survei, atau publikasi sumber

  - field_name: portal_geography
    label: Cakupan wilayah
    form_placeholder: Kabupaten Wajo, kecamatan, desa/kelurahan

  - field_name: portal_category
    label: Kategori infografik/publikasi
    form_placeholder: Kesehatan, pendidikan, ekonomi, pemerintahan

  - field_name: portal_period
    label: Periode tampil infografik/publikasi
    form_placeholder: 2025

  - field_name: portal_attribution
    label: Atribusi/penerbit
    form_placeholder: Nama perangkat daerah/penerbit

resource_fields:
  - field_name: url
    label: URL resource atau berkas unggahan
    preset: resource_url_upload

  - field_name: name
    label: Nama resource
    form_placeholder: Data menurut kecamatan, CSV, atau laporan PDF

  - field_name: description
    label: Deskripsi resource
    form_snippet: markdown.html
    form_placeholder: Cakupan isi, kolom, periode, dan cara penggunaan resource.

  - field_name: format
    label: Format
    preset: resource_format_autocomplete

  - field_name: portal_resource_role
    label: Peran resource
    preset: select
    choices:
      - value: data
        label: Data terstruktur
      - value: sumber
        label: Berkas sumber
      - value: infografik
        label: Gambar/infografik utama
      - value: publikasi
        label: Publikasi/laporan
      - value: metodologi
        label: Metodologi/dokumentasi
      - value: geospasial
        label: Data geospasial
    validators: ignore_missing

  - field_name: portal_resource_period
    label: Periode resource
    form_placeholder: 2024 atau Januari–Desember 2025

  - field_name: portal_resource_version
    label: Versi resource
    form_placeholder: 1.0 atau revisi-2025-02
