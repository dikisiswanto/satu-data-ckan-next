name: CKAN-backed Next.js portal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify public portal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CKAN_API_INTERNAL_URL: http://127.0.0.1:8010/api/3/action
      PUBLIC_SITE_ORIGIN: http://127.0.0.1:3100
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_CKAN_ADMIN_URL: https://ckan.example.test
      NEXT_PUBLIC_REGION_NAME: Kabupaten Wajo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check Node and npm versions
        run: |
          node --version
          npm --version
      - name: Install locked dependencies
        run: HUSKY=0 npm ci
      - name: Check CKAN architecture and local imports
        run: npm run check
      - name: Run ESLint
        run: npm run lint
      - name: Run unit tests
        run: npm run test
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: Run public E2E tests against mocked CKAN 2.12 Action API
        run: npm run test:e2e
      - name: Build production application
        run: npm run build
      - name: Check production dependencies for known vulnerabilities
        run: npm run security:check

  deployment-config:
    name: Validate deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML and shell syntax
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f, aliases: true); puts "valid YAML: #{f}" }' \
            deploy/ckan/docker-compose.override.yml \
            deploy/ckan/docker-compose.cloudflare.yml \
            deploy/ckan/docker-compose.manual.yml \
            deploy/ckan/schemas/dataset.yaml \
            .github/workflows/ci.yml
          bash -n deploy/ckan/bootstrap-upstream.sh deploy/ckan/compose.sh deploy/ckan/enable-xloader.sh deploy/ckan/initialize-extensions.sh deploy/ckan/apply-datastore-permissions.sh
          python3 scripts/check-ckan-build-overlay.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for name in ('deploy/ckan/configure-upstream-extensions.py', 'deploy/ckan/render-upstream-env.py', 'deploy/ckan/sync-env.py', 'scripts/check-ckan-build-overlay.py', 'scripts/check-ckan-plugin-entrypoints.py', 'scripts/check-env-single-source.py'):
              ast.parse(Path(name).read_text())
              print(f'valid Python: {name}')
          PY
      - name: Ensure no legacy application remains
        run: npm run check
  ckan-extension-image-smoke:
    name: Smoke-test CKAN extensions on the pinned base image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Pull the pinned official CKAN base image
        run: docker pull ckan/ckan-base:2.12.1
      - name: Build an extension compatibility image and verify plugin entry points
        run: |
          cat > Dockerfile.ckan-extension-smoke <<'DOCKER'
          FROM ckan/ckan-base:2.12.1
          USER root
          COPY deploy/ckan/extensions/requirements.txt /tmp/portal-ckan-extensions.txt
          COPY scripts/check-ckan-plugin-entrypoints.py /tmp/check-ckan-plugin-entrypoints.py
          RUN pip install --no-cache-dir -r /tmp/portal-ckan-extensions.txt \
              && python /tmp/check-ckan-plugin-entrypoints.py
          DOCKER
          docker build --pull -f Dockerfile.ckan-extension-smoke -t portal-ckan-extension-smoke .
