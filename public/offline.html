<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#174566" />
    <title>Koneksi tidak tersedia | Portal Satu Data</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #1b2e3d;
        background: #f4f6f8;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 34rem);
        padding: 2rem;
        background: #fff;
        border: 1px solid #d8e0e7;
        border-radius: 12px;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 5vw, 2rem);
        line-height: 1.25;
      }
      p {
        color: #526474;
        line-height: 1.7;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 12px 16px;
        background: #174566;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #176b91;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p><strong>Portal Satu Data</strong></p>
      <h1>Koneksi internet tidak tersedia</h1>
      <p>
        Halaman ini belum dapat dimuat karena perangkat sedang luring.
        Sambungkan kembali perangkat ke internet, lalu coba lagi.
      </p>
      <button type="button" onclick="window.location.reload()">
        Coba lagi
      </button>
    </main>
  </body>
</html>
