name: CKAN-backed Next.js portal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static checks, unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CKAN_API_INTERNAL_URL: http://127.0.0.1:8010/api/3/action
      PUBLIC_SITE_ORIGIN: http://127.0.0.1:3100
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_CKAN_ADMIN_URL: https://ckan.example.test
      NEXT_PUBLIC_REGION_NAME: Kabupaten Wajo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned Python check dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: HUSKY=0 npm ci
      - name: Validate deployment syntax
        run: |
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file, aliases: true); puts "valid YAML: #{file}" }' \
            deploy/ckan/docker-compose.override.yml \
            deploy/ckan/docker-compose.cloudflare.yml \
            deploy/ckan/docker-compose.manual.yml \
            deploy/ckan/docker-compose.cloudflare-basic-auth.yml \
            deploy/ckan/docker-compose.manual-basic-auth.yml \
            deploy/ckan/theme/ckanext/wajo_theme/schemas/dataset.yaml \
            deploy/ckan/theme/ckanext/wajo_theme/schemas/organization.yaml \
            deploy/ckan/theme/ckanext/wajo_theme/schemas/group.yaml \
            .github/workflows/ci.yml \
            .github/workflows/extended-validation.yml
          bash -n scripts/check-static.sh \
            deploy/ckan/bootstrap-upstream.sh \
            deploy/ckan/compose.sh \
            deploy/ckan/sync-ckan-base-source.sh \
            deploy/ckan/prepare-ckan-base.sh \
            deploy/ckan/enable-xloader.sh \
            deploy/ckan/initialize-extensions.sh \
            deploy/ckan/apply-datastore-permissions.sh
      - name: Run static checks and ESLint
        run: npm run check
      - name: Run unit tests
        run: npm run test
      - name: Build production application
        run: npm run build
